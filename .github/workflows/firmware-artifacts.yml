name: Firmware Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi

      - name: Configure
        run: cmake -S firmware -B firmware/build -G Ninja

      - name: Build
        run: cmake --build firmware/build --parallel

      - name: Collect artifacts
        run: |
          mkdir -p firmware/artifacts
          find firmware/build -maxdepth 2 -type f \( -name "*.uf2" -o -name "*.hex" \) -exec cp {} firmware/artifacts/ \;
          ls -la firmware/artifacts

      - name: Upload UF2 and HEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscp-demo-w55rp20-firmware
          path: firmware/artifacts/*
          if-no-files-found: error